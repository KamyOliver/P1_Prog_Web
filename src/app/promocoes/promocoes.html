<section class="pagina-promocoes">

  <!-- ===================================== -->
  <!-- BANNER -->
  <!-- ===================================== -->

  <section class="banner-promocoes">

    <img
      src="logopromocoes.png"
      alt="Promoções Abbey Road Records"
      class="imagem-promocoes"
    >

  </section>


  <!-- ===================================== -->
  <!-- CONTEÚDO -->
  <!-- ===================================== -->

  <section class="conteudo-promocoes">


    <!-- ===================================== -->
    <!-- ÁREA DOS FILTROS -->
    <!-- ===================================== -->

    <aside class="area-filtros">

      <!-- Caixa escura dos filtros -->
      <div class="caixa-filtros">


        <!-- Cabeçalho -->
        <div class="cabecalho-filtros">

          <h2>

            <span class="icone-filtro">
              <span class="linha-icone linha-1"></span>
              <span class="linha-icone linha-2"></span>
              <span class="linha-icone linha-3"></span>
            </span>

            FILTROS

          </h2>


          <button
            type="button"
            class="limpar-filtros"
            (click)="limparFiltros()"
          >
            Limpar filtros
          </button>

        </div>


        <!-- Linha -->
        <div class="linha-filtro"></div>


        <!-- ===================================== -->
        <!-- CATEGORIA -->
        <!-- ===================================== -->

        <div class="grupo-filtro">

          <div class="titulo-grupo">

            <h3>CATEGORIA</h3>

            <span class="seta-filtro">
              ⌃
            </span>

          </div>


          <!-- Grunge -->
          <label class="opcao-filtro">

            <input
              type="checkbox"
              value="Grunge"
              [checked]="categoriasSelecionadas.includes('Grunge')"
              (change)="selecionarCategoria('Grunge', $event)"
            >

            <span>Grunge</span>

          </label>


          <!-- Rock -->
          <label class="opcao-filtro">

            <input
              type="checkbox"
              value="Rock"
              [checked]="categoriasSelecionadas.includes('Rock')"
              (change)="selecionarCategoria('Rock', $event)"
            >

            <span>Rock</span>

          </label>


          <!-- MPB -->
          <label class="opcao-filtro">

            <input
              type="checkbox"
              value="MPB"
              [checked]="categoriasSelecionadas.includes('MPB')"
              (change)="selecionarCategoria('MPB', $event)"
            >

            <span>MPB</span>

          </label>


          <!-- Rap -->
          <label class="opcao-filtro">

            <input
              type="checkbox"
              value="Rap"
              [checked]="categoriasSelecionadas.includes('Rap')"
              (change)="selecionarCategoria('Rap', $event)"
            >

            <span>Rap</span>

          </label>

        </div>


        <!-- Linha separadora -->
        <div class="linha-filtro"></div>


        <!-- ===================================== -->
        <!-- ARTISTA -->
        <!-- ===================================== -->

        <div class="grupo-filtro">

          <div class="titulo-grupo">

            <h3>ARTISTA</h3>

            <span class="seta-filtro">
              ⌃
            </span>

          </div>


          <!-- Mensagem quando nenhuma categoria está selecionada -->
          <p
            class="mensagem-filtro"
            *ngIf="categoriasSelecionadas.length === 0"
          >
            Selecione uma categoria
          </p>


          <!-- Artistas das categorias selecionadas -->
          <label
            class="opcao-filtro"
            *ngFor="let artista of artistasDisponiveis"
          >

            <input
              type="checkbox"
              [value]="artista"
              [checked]="artistasSelecionados.includes(artista)"
              (change)="selecionarArtista(artista, $event)"
            >

            <span>{{ artista }}</span>

          </label>

        </div>
      <!-- Botão para aplicar os filtros -->
<button
  type="button"
  class="botao-filtrar"
    (click)="aplicarFiltros()"
>
  FILTRAR
</button>


</div>
<!-- Fim caixa-filtros -->


</aside>

    <!-- ===================================== -->
    <!-- ÁREA DOS DISCOS -->
    <!-- ===================================== -->

    <main class="area-discos">


      <!-- ===================================== -->
      <!-- GRADE DOS DISCOS COM BOOTSTRAP -->
      <!-- ===================================== -->

      <div class="row g-4 grade-discos">


        <!--
          Bootstrap:
          col-12 = 1 card por linha em telas pequenas
          col-sm-6 = 2 cards por linha
          col-lg-4 = 3 cards por linha
        -->

        <div
          class="col-12 col-sm-6 col-lg-4"
          *ngFor="let obj of produtosPaginados"
        >


          <!-- Card -->
          <div class="card-disco">


            <!-- Desconto -->
            <div class="desconto">

              -{{ obj.desconto }}%

            </div>


            <!-- Imagem -->
            <img
              [src]="'discos/' + obj.codigo + '.png'"
              [alt]="obj.album"
              class="imagem-disco"
            >


            <!-- Álbum -->
            <h3>

              {{ obj.album }}

            </h3>


            <!-- Banda -->
            <p class="banda">

              {{ obj.banda }}

            </p>


            <!-- Estado -->
            <p class="estado">

              {{ obj.estado }}

            </p>


            <!-- Preços -->
            <div class="precos">


              <span class="preco-antigo">

                R$ {{ obj.valor.toFixed(2).replace('.', ',') }}

              </span>


              <span class="preco-promocional">

                R$ {{ obj.valorDesconto?.toFixed(2)?.replace('.', ',') }}

              </span>


            </div>
            <!-- Botões do produto -->
<div class="acoes-disco">

  <!-- Ver detalhes -->
  <a
    [routerLink]="['/detalhe']"
    [queryParams]="{ codigo: obj.codigo, origem: 'promocoes' }"
    class="botao-detalhe"
  >
    VER DETALHES
  </a>


  <!-- Comprar -->
  <button
    type="button"
    class="botao-comprar"
    *ngIf="obj.estoque > 0"
  >
    COMPRAR
  </button>

</div>

          </div>
          <!-- Fim card -->


        </div>
        <!-- Fim coluna Bootstrap -->


      </div>
      <!-- Fim grade dos discos -->


<!-- ===================================== -->
<!-- PAGINAÇÃO -->
<!-- ===================================== -->

<div
  class="paginacao"
  *ngIf="totalPaginas > 1"
>

  <!-- Página anterior -->

  <button
    type="button"
    class="botao-pagina"
    (click)="mudarPagina(paginaAtual - 1)"
    [disabled]="paginaAtual === 1"
  >
    ‹
  </button>


  <!-- ===================================== -->
  <!-- NÚMEROS - COMPUTADOR -->
  <!-- ===================================== -->

  <div class="paginas-desktop">

    <button
      type="button"
      class="botao-pagina"
      *ngFor="let pagina of paginas"
      [class.pagina-ativa]="paginaAtual === pagina"
      (click)="mudarPagina(pagina)"
    >
      {{ pagina }}
    </button>

  </div>


  <!-- ===================================== -->
  <!-- NÚMEROS - CELULAR -->
  <!-- ===================================== -->

  <div class="paginas-mobile">

    <button
      type="button"
      class="botao-pagina"
      *ngFor="let pagina of paginasMobile"
      [class.pagina-ativa]="paginaAtual === pagina"
      (click)="mudarPagina(pagina)"
    >
      {{ pagina }}
    </button>

  </div>


  <!-- Página seguinte -->

  <button
    type="button"
    class="botao-pagina"
    (click)="mudarPagina(paginaAtual + 1)"
    [disabled]="paginaAtual === totalPaginas"
  >
    ›
  </button>

</div>

<!-- Fim paginação -->

    </main>
    <!-- Fim área-disco -->
