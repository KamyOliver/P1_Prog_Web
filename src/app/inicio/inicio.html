<!-- BANNER PRINCIPAL -->
<section class="inicio-banner">

  <div class="lado-imagem">
    <img
      src="banner.jpg"
      alt="Abbey Road Records"
      class="imagem-banner">
  </div>

</section>


<!-- CARROSSEL DE PROMOÇÕES -->
<div
  id="promocoesCarousel"
  class="carousel slide"
  data-bs-ride="carousel"
  data-bs-interval="3000"
  data-bs-pause="false"
  data-bs-wrap="true">

  <div class="carousel-inner">

    <!-- PROMOÇÃO 1 -->
    <div class="carousel-item active">

      <a routerLink="/promocoes">
        <img
          src="promocao1.png"
          alt="Promoção Abbey Road Records"
          class="d-block w-100 imagem-promocao">
      </a>

    </div>


    <!-- PROMOÇÃO 2 -->
    <div class="carousel-item">

      <a routerLink="/promocoes">
        <img
          src="promocao2.png"
          alt="Promoção Abbey Road Records"
          class="d-block w-100 imagem-promocao">
      </a>

    </div>

  </div>


  <!-- SETA PARA VOLTAR -->
  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#promocoesCarousel"
    data-bs-slide="prev">

    <span
      class="carousel-control-prev-icon"
      aria-hidden="true">
    </span>

    <span class="visually-hidden">Anterior</span>

  </button>


  <!-- SETA PARA AVANÇAR -->
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#promocoesCarousel"
    data-bs-slide="next">

    <span
      class="carousel-control-next-icon"
      aria-hidden="true">
    </span>

    <span class="visually-hidden">Próximo</span>

  </button>

</div>
