<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Loja de Ferragens</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
  <app-root></app-root>

  <!-- Início do componente VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <!-- Fim do componente VLibras -->

  <!-- Filtros SVG para Daltonismo -->
  <svg style="display: none;">
    <defs>
      <!-- Protanopia (dificuldade com vermelho) -->
      <filter id="protanopia">
        <feColorMatrix type="matrix" values="0.567, 0.433, 0,     0, 0
                                             0.558, 0.442, 0,     0, 0
                                             0,     0.242, 0.758, 0, 0
                                             0,     0,     0,     1, 0"/>
      </filter>
      <!-- Deuteranopia (dificuldade com verde) -->
      <filter id="deuteranopia">
        <feColorMatrix type="matrix" values="0.625, 0.375, 0,   0, 0
                                             0.7,   0.3,   0,   0, 0
                                             0,     0.3,   0.7, 0, 0
                                             0,     0,     0,   1, 0"/>
      </filter>
      <!-- Tritanopia (dificuldade com azul) -->
      <filter id="tritanopia">
        <feColorMatrix type="matrix" values="0.95, 0.05,  0,     0, 0
                                             0,    0.433, 0.567, 0, 0
                                             0,    0.475, 0.525, 0, 0
                                             0,    0,     0,     1, 0"/>
      </filter>
      <!-- Acromatopsia (monocromático / escala de cinza) -->
      <filter id="achromatopsia">
        <feColorMatrix type="matrix" values="0.299, 0.587, 0.114, 0, 0
                                             0.299, 0.587, 0.114, 0, 0
                                             0.299, 0.587, 0.114, 0, 0
                                             0,     0,     0,     1, 0"/>
      </filter>
    </defs>
  </svg>

  <!-- Funções de Controle de Acessibilidade -->
  <script>
    function aplicarDaltonismo(modo) {
      document.body.classList.remove('filter-protanopia', 'filter-deuteranopia', 'filter-tritanopia', 'filter-achromatopsia');
      if (modo && modo !== 'padrao') {
        document.body.classList.add('filter-' + modo);
      }
    }

    function toggleAltoContraste() {
      document.body.classList.toggle('high-contrast');
    }
  </script>
</body>
</html>
